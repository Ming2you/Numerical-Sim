    A_to_D: 220.0
    D_to_A: 220.0
    B_to_E: 220.0
    E_to_B: 220.0
    C_to_F: 220.0
    F_to_C: 220.0
    D_to_E: 220.0
    E_to_D: 220.0
    E_to_F: 220.0
    F_to_E: 220.0
    D_R_W: 180.0
    F_R_W: 180.0
    D_R_E: 180.0
    F_R_E: 180.0
    OR_D_W_storage: 120.0
    OR_F_W_storage: 120.0
    OR_D_E_storage: 120.0
    OR_F_E_storage: 120.0
  off_ramps:
  - OR_D_W
  - OR_F_W
  - OR_D_E
  - OR_F_E
