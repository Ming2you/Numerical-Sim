  green_max_fraction: 0.8
freeway_offramp_capacity_drop:
  enabled: true
  lane_reduction: 0.35
  gamma: 0.5
  b: 2.0
mpc:
  horizon_steps: 3
  leader_candidate_count: 15
  follower_solver_mode: two_block
  max_nash_iter: 10
  nash_obj_tol: 0.001
  nash_control_tol: 0.001
  nash_relaxation_alpha: 0.8
  distributed_coupling_tol: 0.001
  control_horizon_steps: 3
  urban_freeway_tts_weight_alpha: 1.0
  optimizer_maxiter: 40
  optimizer_n_starts: 2
  relaxed_quantized_controls: false
  relaxed_fast_mode: false
  relaxed_green_quantum_sec: 1.0
  relaxed_vsl_quantum_km_h: 10.0
  relaxed_rounding_mode: floor
  relaxed_wu_vsl_include_neutral: true
leader:
  objective_mode: state_accumulation
  w_P: 1.0
  w_F: 1.0
  w_L: 0.05
  N_P_star_range:
  - 0.0
  - 850.0
  N_UF_star_range:
  - 0.0
  - 6000.0
  # S_eff(링크 유효 가용공간, spec §3.3 397행) plant 재calibration(2026-06-15/results/
  # setpoint_calibration_post_seff, peak_demand, urban-scales 0.5~3.0):
  # MFD 정점 production 33805 veh/h @ N_P=725.897 (urban_scale 3.0, t=1080s).
  # movement 점큐가 origin 링크 점유로 잡혀 backup이 더 일찍 전파 → critical
  # accumulation이 778.703→725.897로 하락. (직전 off-ramp게이트 plant 값 778.703,
  # 그 이전 cycle 위상 plant 521.281.)
  # 2026-06-16 재calibration: CTM receiving/supply + boundary_out 유한용량 +
  # 4-세그먼트 토폴로지(상류 plain seg0) 반영. peak_demand scale 0.5~3.0, T_total 7200의
  # MFD 정점에서 725.897→556.081로 하락(binned 정점 ~528, argmax 556 일치). 직전 725.897은
  # 정점을 지난 congested branch라 leader setpoint가 과대(perimeter 과소개입)였음.
  N_P_crit_veh: 556.081
  N_P_candidate_lower_factor: 0.9
  N_P_candidate_upper_factor: 1.05
  N_P_star_unit: veh
  N_UF_star_unit: veh_per_hour
  # cycle 위상 plant에서 N_P가 cycle 주기로 진동해 feedback/추적 창을 더 길게 둔다.
  N_P_feedback_horizon_h: 1.5
  N_P_feedback_flow_limit_veh_h: 800.0
  N_UF_feasible_margin: 0.95
  non_convergence_penalty: 500.0
  non_convergence_objective_residual_scale: 1.0
  non_convergence_control_residual_scale: 1.0
  state_accumulation_exclude_boundary_legs: true
  use_effective_lanes_for_density_penalty: true
  metering_congestion_weight: 0.45
  metering_queue_weight: 4.0
  vsl_activation_density_ratio: 0.95
  metering_activation_density_ratio: 0.95
